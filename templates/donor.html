<!DOCTYPE html>
<html lang="en">
<head>
    <title>LifeDrops | Donor Hub</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero-green: #10b981;
            --hero-soft: #ecfdf5;
            --deep-slate: #0f172a;
            --urgent-red: #ef4444;
            --gold-accent: #f59e0b;
            --bg-body: #f8fafc;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(#cbd5e1 0.6px, transparent 0.6px);
            background-size: 24px 24px;
            min-height: 100vh;
            padding: 20px;
            color: var(--deep-slate);
        }

        .dashboard {
            max-width: 580px;
            margin: 40px auto;
        }

        /* --- NAVIGATION --- */
        .header {
            background: var(--hero-green);
            color: #fff;
            padding: 18px 24px;
            border-radius: 22px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px -10px rgba(16, 185, 129, 0.35);
        }

        .header h1 { font-size: 1rem; font-weight: 800; letter-spacing: -0.02em; }
        
        .logout {
            background: rgba(255,255,255,0.2);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .logout:hover { background: #fff; color: var(--hero-green); }

        /* --- THE VIP WALLET --- */
        .wallet-section {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 35px;
            border-radius: 32px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
        }

        .wallet-section::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--hero-green);
            filter: blur(80px);
            top: -50px;
            right: -50px;
            opacity: 0.2;
        }

        .wallet-section h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #64748b;
            margin-bottom: 25px;
            font-weight: 800;
        }

        .wallet-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .wallet-stat {
            background: rgba(255,255,255,0.03);
            padding: 18px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .wallet-stat strong {
            font-size: 2.4rem;
            display: block;
            color: var(--hero-green);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .wallet-stat small { color: #94a3b8; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

        .eligible-badge {
            padding: 10px 18px;
            border-radius: 99px;
            font-weight: 800;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .eligible { background: #064e3b; color: #34d399; }
        .not-eligible { background: #450a0a; color: #f87171; }

        /* --- INTERFACE CARDS --- */
        .card {
            background: white;
            padding: 28px;
            margin-bottom: 20px;
            border-radius: 26px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
        }

        .card h3 {
            margin-bottom: 18px;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- GPS SIGNAL --- */
        .status-card {
            padding: 16px 22px;
            background: #f8fafc;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #edf2f7;
        }

        .pulse-icon {
            width: 8px;
            height: 8px;
            background: var(--hero-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- REQUEST ITEMS --- */
        .request-item {
            padding: 24px;
            background: #fff;
            border: 1px solid #f1f5f9;
            border-radius: 22px;
            margin-bottom: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .request-item:hover {
            transform: translateY(-3px);
            border-color: var(--hero-green);
            box-shadow: 0 12px 25px -5px rgba(0,0,0,0.05);
        }

        .urgent-pill {
            font-size: 0.6rem;
            font-weight: 900;
            color: var(--urgent-red);
            background: #fff1f2;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- ALERTS --- */
        .alerts-panel {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 320px;
            z-index: 1000;
        }

        .alert-toast {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            color: white;
            border-left: 4px solid var(--urgent-red);
            padding: 16px 20px;
            border-radius: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            margin-top: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }
        
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h1>🩸 LifeDrops / Terminal</h1>
        <a href="/" class="logout">Logout</a>
    </div>

    <div class="wallet-section">
        <h3>Operational Profile</h3>
        <div class="wallet-stats">
            <div class="wallet-stat">
                <strong id="credits">0</strong>
                <small>Credits</small>
            </div>
            <div class="wallet-stat">
                <strong id="donations">0</strong>
                <small>Lives Saved</small>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="eligibleBadge" class="eligible-badge eligible">
                <span class="pulse-icon" style="background:#34d399"></span>Eligible
            </span>
            <small id="nextDate" style="color:#64748b; font-weight:700; font-size:0.7rem; text-transform:uppercase"></small>
        </div>
        <div id="statusMsg" style="margin-top:20px; color:var(--hero-green); font-size:0.7rem; font-weight:800; opacity:0.8; letter-spacing:0.05em"></div>
    </div>

    <div class="card">
        <h3>Live Radar Signal</h3>
        <div id="location" class="status-card">
            <span style="font-weight:700; color:#94a3b8; font-size:0.85rem">Connecting to Satellites...</span>
        </div>
    </div>

    <div style="margin-top: 35px;">
        <h3 style="color:#94a3b8; font-size:0.85rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; padding-left:15px; margin-bottom:15px;">Active Mission Feed</h3>
        <div id="requests">
            <div style="text-align:center; padding:50px; color:#cbd5e1; font-weight:600;">Scanning perimeter...</div>
        </div>
    </div>
</div>

<div class="alerts-panel" id="alerts"></div>

<script>
    let user = JSON.parse(localStorage.getItem('user'));
    if(!user || user[2] !== 'Donor') location.href = '/';
    let lat = 25.5941, lon = 85.1376;

    async function loadWallet(){
        const res = await fetch(`/api/wallet/${user[0]}`);
        const wallet = await res.json();
        document.getElementById('credits').textContent = wallet.credits;
        document.getElementById('donations').textContent = wallet.donations;
        
        const badge = document.getElementById('eligibleBadge');
        const nextDate = document.getElementById('nextDate');
        
        if(wallet.eligible_next){
            badge.innerHTML = '<span class="pulse-icon" style="background:#34d399"></span> Eligible Now';
            badge.className = 'eligible-badge eligible';
            nextDate.textContent = 'Mission Ready';
        } else {
            badge.innerHTML = '<span class="pulse-icon" style="background:#f87171"></span> On Cooldown';
            badge.className = 'eligible-badge not-eligible';
            nextDate.textContent = 'Resting Period';
        }
        document.getElementById('statusMsg').textContent = `SYSTEM LOG: Last session ${wallet.last_donation ? new Date(wallet.last_donation).toLocaleDateString() : 'None'}`;
    }

    async function getLocation(){
        try {
            const pos = await new Promise(r => navigator.geolocation.getCurrentPosition(r));
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
            document.getElementById('location').innerHTML = `
                <div style="display:flex; align-items:center;">
                    <span class="pulse-icon"></span>
                    <span style="font-weight:800; color:var(--hero-green); font-size:0.85rem;">Active Signal</span>
                </div>
                <span style="font-size:0.8rem; font-weight:800; color:#cbd5e1;">${lat.toFixed(3)}° N, ${lon.toFixed(3)}° E</span>
            `;
            getRequests();
        } catch {
            document.getElementById('location').textContent = '⚠️ Signal Blocked. Enable GPS.';
        }
    }

    async function getRequests(){
        const res = await fetch('/api/donors?blood=A+&lat='+lat+'&lon='+lon);
        const data = await res.json();
        const reqContainer = document.getElementById('requests');

        if(data.donors.length > 0) {
            reqContainer.innerHTML = data.donors.map(d => `
                <div class="request-item">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <strong style="font-size:1.1rem; color:var(--deep-slate); letter-spacing:-0.02em;">${d.name}</strong>
                            <div style="font-size:0.8rem; color:#64748b; font-weight:600; margin-top:4px;">📍 ${d.location}</div>
                        </div>
                        <span class="urgent-pill">Urgent Match</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; padding-top:15px; border-top:1px solid #f8fafc;">
                        <span style="font-size:0.75rem; font-weight:800; color:var(--hero-green); text-transform:uppercase;">+${d.credits} Reward</span>
                        <span style="font-size:0.7rem; font-weight:700; color:#cbd5e1;">Match Rank: #1</span>
                    </div>
                </div>
            `).join('');
        } else {
            reqContainer.innerHTML = '<div style="padding:40px; color:#cbd5e1; text-align:center; font-weight:700; background:white; border-radius:26px;">Perimeter Clear. No active requests.</div>';
        }
    }

    async function updateAlerts(){
        const res = await fetch('/api/alerts');
        const data = await res.json();
        const alertList = document.getElementById('alerts');
        if(data.alerts.length > 0) {
            alertList.innerHTML = '<div style="font-size:0.65rem; font-weight:900; color:#94a3b8; text-transform:uppercase; margin-bottom:8px; letter-spacing:0.1em; text-align:right;">Satellite Comms</div>' + 
            data.alerts.map(a => `<div class="alert-toast">${a.msg}</div>`).join('');
        }
    }

    setInterval(getRequests, 5000);
    setInterval(updateAlerts, 3000);
    loadWallet();
    getLocation();
    updateAlerts();
</script>

</body>
</html>
