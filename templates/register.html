<!DOCTYPE html><html><head><title>LifeDrops Register</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#f8fafc;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}.form-card{background:#fff;max-width:420px;width:100%;padding:40px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,0.1)}h1{font-size:2.2em;color:#1e40af;margin-bottom:30px;text-align:center;font-weight:800}input,select{width:100%;padding:14px;margin:8px 0;border:2px solid #e5e7eb;border-radius:12px;font-size:16px}input:focus,select:focus{outline:none;border-color:#3b82f6}button{width:100%;padding:16px;background:#10b981;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin:20px 0;transition:all .2s}button:hover{background:#059669;transform:translateY(-1px)}a{display:block;text-align:center;margin:20px 0;color:#3b82f6;text-decoration:none;font-weight:500}a:hover{text-decoration:underline}#status{margin-top:15px;text-align:center;font-weight:500}</style></head><body><div class="form-card"><h1>📍 Join LifeDrops</h1><form id="registerForm"><input name="name" placeholder="Full Name *" required><select name="role"><option value="Donor">🩸 I'm a Donor (Earn Credits!)</option><option value="Patient">🏥 I Need Blood</option></select><input name="blood_group" placeholder="Blood Group (A+)" required><input name="location" placeholder="City/Area (Patna)"><input name="password" type="password" placeholder="Password *" required><button type="submit">Create Account</button></form><p id="status"></p><a href="/login">← Back to Login</a><a href="/">← Home</a><script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const formData=new FormData(e.target);try{const pos=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:10000}));formData.append('latitude',pos.coords.latitude);formData.append('longitude',pos.coords.longitude)}catch{formData.append('latitude',25.5941);formData.append('longitude',85.1376)}const res=await fetch('/api/register',{method:'POST',body:formData});const data=await res.json();const status=document.getElementById('status');status.textContent=data.success?'✅ Registered! Login now.':'❌ '+data.error;status.style.color=data.success?'#10b981':'#ef4444'}</script></body></html>
